{% extends "base.html" %}
{% block title %}Page not found{% endblock %}
{% block content %}
<section class="mx-auto max-w-xl px-5 pb-24 pt-40 text-center lg:px-8">
  <p class="font-display text-[clamp(5rem,18vw,10rem)] leading-none text-gradient">404</p>
  <h1 class="mt-4 font-display text-[var(--step-2)]">This page went off the map</h1>
  <p class="mt-4 text-mist">The link may be old, or the trip may have finished its run. Everything still bookable is one click away.</p>
  <div class="mt-9 flex flex-wrap justify-center gap-3">
    <a href="{% url 'destinations:package_list' %}" class="btn btn-primary">Browse trips</a>
    <a href="{% url 'core:home' %}" class="btn btn-ghost">Back home</a>
  </div>
</section>
{% endblock %}
