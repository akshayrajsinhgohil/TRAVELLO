{% extends "accounts/auth_base.html" %}
{% block aside_heading %}Locked out? It happens.{% endblock %}
{% block form_content %}
<h1 class="font-display text-[var(--step-2)]">Reset your password</h1>
<p class="mt-2 text-sm text-mist">Enter the email on your account and we'll send a link.</p>
<form method="post" class="mt-8 space-y-5">
  {% csrf_token %}
  <div>
    <label for="{{ form.email.id_for_label }}" class="mb-2 block text-sm text-mist">Email</label>
    <input type="email" name="email" id="{{ form.email.id_for_label }}" required
           class="w-full rounded-2xl border border-white/10 bg-white/5 px-4 py-3 text-cream placeholder-mist/60 outline-none focus:border-magenta/60"
           placeholder="you@example.com">
  </div>
  <button class="btn btn-primary w-full">Send reset link</button>
</form>
<p class="mt-7 text-center text-sm text-mist"><a href="{% url 'accounts:login' %}" class="text-magenta underline">Back to sign in</a></p>
{% endblock %}
